  - name: Software & Computing
    skills: [Unity, C#, OpenCV, Computer Vision, Augmented Reality, Virtual Reality, Microsoft HoloLens, Mobile App Development, Machine Learning, Physics Simulation, Data Visualization, Game Design, 3D Modeling]
  - name: Research & Leadership
    skills: [User Studies, Qualitative Research, Interviews, Surveys, Needfinding, Statistical Analysis, Literature Review, Classroom Deployment, Mentorship, Public Speaking]

