# The three pillars, in the order of the portfolio thesis; `step` is the value each
# brings. Posts join a pillar with `pillar: <id>` in their front matter;
# `pillar: other` lists under Other work.
focus_areas:
  - id: foundations
    step: Creating custom hardware
    title: Mechanical design
    description: Haptic and bio-inspired robots, compliant robot feet, multi-material 3D printing, and CAD and manufacturing. This is the hands-on engineering everything else is built on.
    link: /mechanical-design/
    link_label: View mechanical design work
    image: themes/mechanical-design.webp
    image_alt: Exploded CAD view of the KITE robot showing its camera, motors, omni wheels, axles, battery, Raspberry Pi, and power converters.
  - id: interfaces
    step: Tangible interfaces
    title: Physical interfaces for digital systems
    description: Hardware that gives software a body, such as a haptic robot that renders simulated forces and a 3D-printed microscope that drives a smartphone app.
    link: /physical-interfaces/
    link_label: View tangible interfaces
    image: themes/physical-interfaces.webp
    image_alt: A student operating the instrumented microscope while a connected smartphone shows onion cells with cell-counting tools.
  - id: experiences
    step: Understanding built by doing
    title: Tangible learning experiences
    description: Studies with students showing how augmenting real experiments, rather than replacing them, deepens scientific reasoning and engagement.
    link: /tangible-learning/
    link_label: View learning research
    image: themes/tangible-learning.webp
    image_alt: A student swinging a real pendulum while a tablet overlays an AR protractor and energy bar.

